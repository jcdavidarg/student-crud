<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Inscripción Universitaria</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="page">
      <section class="card">
        <header class="card-header">
          <h1>Inscripción Universitaria</h1>
          <p>
            Completá tus datos y seleccioná la carrera en la que deseas
            inscribirte.
          </p>
        </header>

        <form id="inscripcion-form">
          <div class="form-row">
            <div class="form-group">
              <label for="nombre">Nombre</label>

              <input type="text" id="nombre" name="nombre" required />
            </div>

            <div class="form-group">
              <label for="apellido">Apellido</label>

              <input type="text" id="apellido" name="apellido" required />
            </div>
          </div>

          <div class="form-group">
            <label for="dni">DNI</label>

            <input
              type="text"
              id="dni"
              name="dni"
              maxlength="8"
              inputmode="numeric"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>

            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="telefono">Teléfono</label>

              <input type="text" id="telefono" name="telefono" />
            </div>

            <div class="form-group">
              <label for="nacionalidad">Nacionalidad</label>

              <input type="text" id="nacionalidad" name="nacionalidad" />
            </div>
          </div>

          <div class="form-group">
            <label for="carrera">Carrera</label>

            <select id="carrera" name="carrera" required>
              <option value="">Seleccioná una carrera...</option>
            </select>
          </div>

          <div id="mensaje" class="message" role="alert"></div>

          <button type="submit" id="btn-inscribir">Inscribirme</button>
        </form>
      </section>
    </main>

    <script src="js/public.js"></script>
  </body>
</html>
