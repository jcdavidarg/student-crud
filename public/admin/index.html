<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Panel Administrativo</title>

    <script>
      // Calcula el contexto de la app (raiz en local o docker) quitando el
      // segmento /admin del path actual, y lo usa como base para las rutas
      // relativas (css/js). Asi funciona igual con o sin la barra final.
      (function () {
        var base = document.location.pathname.replace(/\/admin\/?.*$/, "") || "/";
        if (base.charAt(base.length - 1) !== "/") base += "/";
        document.write('<base href="' + base + '" />');
      })();
    </script>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="page">
      <section class="card">
        <header class="card-header">
          <h1>Panel Administrativo</h1>
          <p>Administración de estudiantes, carreras e inscripciones.</p>
        </header>

        <!-- ========================= -->
        <!-- ESTUDIANTES -->
        <!-- ========================= -->

        <section class="admin-section">
          <div class="section-header">
            <div>
              <h2>Estudiantes</h2>
              <p>Gestioná los estudiantes registrados.</p>
            </div>

            <button type="button" id="btn-nuevo-estudiante">
              Nuevo estudiante
            </button>
          </div>

          <div class="search-box">
            <select id="tipo-busqueda-estudiante">
              <option value="id">ID</option>
              <option value="dni">DNI</option>
              <option value="email">Email</option>
            </select>

            <input
              type="text"
              id="buscar-estudiante"
              placeholder="Buscar por ID..."
            />

            <button type="button" id="btn-buscar-estudiante">Buscar</button>

            <button type="button" id="btn-listar-estudiantes">Ver todos</button>
          </div>

          <div id="form-estudiante" class="admin-form hidden">
            <h3>Nuevo estudiante</h3>

            <form id="estudiante-form">
              <div class="form-row">
                <div class="form-group">
                  <label for="estudiante-nombre">Nombre</label>

                  <input type="text" id="estudiante-nombre" required />
                </div>

                <div class="form-group">
                  <label for="estudiante-apellido">Apellido</label>

                  <input type="text" id="estudiante-apellido" required />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="estudiante-dni">DNI</label>

                  <input
                    type="text"
                    id="estudiante-dni"
                    maxlength="8"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="estudiante-email">Email</label>

                  <input type="email" id="estudiante-email" required />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="estudiante-telefono">Teléfono</label>

                  <input type="text" id="estudiante-telefono" />
                </div>

                <div class="form-group">
                  <label for="estudiante-nacionalidad"> Nacionalidad </label>

                  <input type="text" id="estudiante-nacionalidad" />
                </div>
              </div>

              <div class="admin-form-actions">
                <button type="submit">Guardar estudiante</button>

                <button type="button" id="btn-cancelar-estudiante">
                  Cancelar
                </button>
              </div>
            </form>
          </div>

          <div id="estudiantes-container" class="table-container"></div>
        </section>

        <!-- ========================= -->
        <!-- CARRERAS -->
        <!-- ========================= -->

        <section class="admin-section">
          <div class="section-header">
            <div>
              <h2>Carreras</h2>
              <p>Gestioná las carreras disponibles.</p>
            </div>

            <button type="button" id="btn-nueva-carrera">Nueva carrera</button>
          </div>

          <div id="form-carrera" class="admin-form hidden">
            <h3>Nueva carrera</h3>

            <form id="carrera-form">
              <div class="form-group">
                <label for="carrera-nombre"> Nombre </label>

                <input type="text" id="carrera-nombre" required />
              </div>

              <div class="form-group">
                <label for="carrera-codigo"> Código </label>

                <input type="text" id="carrera-codigo" required />
              </div>

              <div class="admin-form-actions">
                <button type="submit">Guardar carrera</button>

                <button type="button" id="btn-cancelar-carrera">
                  Cancelar
                </button>
              </div>
            </form>
          </div>

          <div id="carreras-container" class="table-container"></div>
        </section>

        <!-- ========================= -->
        <!-- INSCRIPCIONES -->
        <!-- ========================= -->

        <section class="admin-section">
          <div class="section-header">
            <div>
              <h2>Inscripciones</h2>
              <p>Consultá y administrá las inscripciones.</p>
            </div>

            <button type="button" id="btn-nueva-inscripcion">
              Nueva inscripción
            </button>
          </div>

          <div id="form-inscripcion" class="admin-form hidden">
            <h3>Nueva inscripción</h3>

            <form id="inscripcion-form">
              <div class="form-group">
                <label for="inscripcion-estudiante">Estudiante</label>

                <select id="inscripcion-estudiante" required>
                  <option value="">Seleccioná un estudiante...</option>
                </select>
              </div>

              <div class="form-group">
                <label for="inscripcion-carrera">Carrera</label>

                <select id="inscripcion-carrera" required>
                  <option value="">Seleccioná una carrera...</option>
                </select>
              </div>

              <div class="admin-form-actions">
                <button type="submit">Guardar inscripción</button>

                <button type="button" id="btn-cancelar-inscripcion">
                  Cancelar
                </button>
              </div>
            </form>
          </div>

          <div id="inscripciones-container" class="table-container"></div>
        </section>

        <!-- ========================= -->
        <!-- MENSAJES -->
        <!-- ========================= -->

        <div id="mensaje" class="message" role="alert"></div>
      </section>
    </main>

    <script src="js/admin.js"></script>
  </body>
</html>
