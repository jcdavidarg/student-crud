<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/app

    # Pasar la configuracion de la DB (definida en el entorno del contenedor)
    # a los CGI. Apache no propaga las variables de entorno por defecto.
    PassEnv DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD

    <Directory /var/www/app>
        Options Indexes FollowSymLinks ExecCGI
        AllowOverride All
        Require all granted

        AddHandler cgi-script .pl
        DirectoryIndex public/index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
